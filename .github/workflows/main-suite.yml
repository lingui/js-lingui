name: main-suite

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ["22", "24"]
        os:
          - ubuntu-latest
          - windows-latest


    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
          scope: '@lingui'

      - name: Install dependencies if needed
        run: yarn install --network-timeout 1000000

      - name: Build packages
        run: yarn release:build

      - name: Unit Testing
        run: yarn test:ci

  babel-8:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: macro plugin on Babel 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          scope: '@lingui'

      - name: Install dependencies if needed
        run: yarn install

      # The workspace stays on Babel 7; only the macro plugin's Babel devDependencies move to 8
      - name: Install Babel 8 for the macro plugin
        run: >-
          yarn workspace @lingui/babel-plugin-lingui-macro add -D
          @babel/core@^8 @babel/parser@^8 @babel/plugin-syntax-jsx@^8
          @babel/preset-typescript@^8 @babel/traverse@^8

      - name: Assert Babel 8 is resolved
        working-directory: packages/babel-plugin-lingui-macro
        run: node -e "const v = require('@babel/core/package.json').version; console.log(v); if (!v.startsWith('8.')) process.exit(1)"

      - name: Build packages
        run: yarn release:build

      - name: Types
        run: yarn workspace @lingui/babel-plugin-lingui-macro check-types

      - name: Unit Testing
        run: yarn vitest --run --project @lingui/babel-plugin-lingui-macro

  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: test
    name: validate (node 22, ubuntu-latest)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          scope: '@lingui'

      - name: Install dependencies if needed
        run: yarn install

      - name: Check Prettier Formatting
        run: yarn prettier:check

      - name: Build packages
        run: yarn release:build

      - name: Linting & Types
        run: yarn lint:all

      - name: Unit Testing
        run: yarn test:ci:coverage

      - name: Test Public Typings
        run: yarn test:types

      - name: E2E Testing
        run: yarn test:e2e

      - name: Check coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          verbose: true
